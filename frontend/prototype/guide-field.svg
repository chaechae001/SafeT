<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">홀과 주방 촬영 구도 예시</title><desc id="desc">실제 매장 사진 대신 안전한 위치에서 공간 전체와 위험한 곳을 확인하는 촬영 구도를 보여 주는 도식</desc><rect width="800" height="440" rx="20" fill="#f4f6ee"/><g font-family="sans-serif" fill="#254637"><text x="28" y="40" font-size="22" font-weight="bold">공간 전체와 위험한 곳을 함께 담아요</text><g transform="translate(25 62)"><rect width="365" height="280" rx="15" fill="white" stroke="#cad8c5"/><text x="20" y="35" font-size="22" font-weight="bold">홀 · 이동 통로</text><rect x="30" y="65" width="105" height="65" rx="12" fill="#ddc9a8"/><rect x="30" y="170" width="105" height="65" rx="12" fill="#ddc9a8"/><rect x="230" y="65" width="105" height="65" rx="12" fill="#ddc9a8"/><rect x="230" y="170" width="105" height="65" rx="12" fill="#ddc9a8"/><path d="M182 242V88m-15 20 15-20 15 20" fill="none" stroke="#4b886b" stroke-width="8" stroke-linecap="round"/><text x="148" y="268" font-size="16">이동 동선</text></g><g transform="translate(410 62)"><rect width="365" height="280" rx="15" fill="white" stroke="#cad8c5"/><text x="20" y="35" font-size="22" font-weight="bold">주방 · 작업 공간</text><rect x="25" y="60" width="315" height="80" rx="8" fill="#d9e2df"/><circle cx="80" cy="100" r="23" fill="#819e91"/><circle cx="145" cy="100" r="23" fill="#819e91"/><rect x="220" y="78" width="95" height="46" rx="6" fill="white" stroke="#819e91" stroke-width="5"/><path d="M60 212h245" stroke="#4b886b" stroke-width="7" stroke-dasharray="12 8"/><text x="58" y="251" font-size="16">안전한 위치에서 작업대 전체 촬영</text></g><text x="28" y="382" font-size="19">① 공간 전체  ② 바닥·기기 주변  ③ 사진 아래 장소 입력</text><text x="28" y="415" font-size="16" fill="#6c806b">촬영을 위해 위험한 곳에 접근하거나 작업 중 촬영하지 마세요. · 예시 도식</text></g></svg>