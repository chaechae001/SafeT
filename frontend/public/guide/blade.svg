<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="칼과 전동 기기: 조리대 위에 놓인 칼과 가위, 덮개가 열린 육절기">
  <!-- UX-011 가상 일러스트(직접 제작) · 빨간 점선 = 찍을 곳 -->
  <rect width="480" height="300" fill="#f3f5f7"/>
  <rect x="20" y="150" width="440" height="20" rx="4" fill="#9fb0a6"/><rect x="20" y="170" width="440" height="130" fill="#b8c4bd"/>
  <!-- 도마와 칼 -->
  <rect x="50" y="122" width="150" height="30" rx="6" fill="#e9c98f"/>
  <rect x="90" y="110" width="96" height="12" rx="4" fill="#d6dcd9"/><rect x="62" y="110" width="30" height="12" rx="3" fill="#2f3a35"/>
  <!-- 가위 -->
  <g transform="translate(215 128) rotate(-20)">
    <rect x="0" y="0" width="58" height="6" rx="3" fill="#aab4bb"/><rect x="0" y="8" width="58" height="6" rx="3" fill="#aab4bb" transform="rotate(14)"/>
    <circle cx="-8" cy="2" r="8" fill="none" stroke="#e5484d" stroke-width="4"/><circle cx="-6" cy="16" r="8" fill="none" stroke="#e5484d" stroke-width="4"/>
  </g>
  <!-- 육절기(덮개 열림) -->
  <rect x="320" y="90" width="110" height="62" rx="8" fill="#8f9a94"/>
  <circle cx="360" cy="96" r="34" fill="#cfd6d2" stroke="#7d8a83" stroke-width="5"/>
  <rect x="380" y="40" width="50" height="10" rx="4" fill="#7d8a83" transform="rotate(-35 380 40)"/>
  <rect x="415" y="132" width="6" height="40" fill="#2f3a35"/><rect x="410" y="168" width="16" height="10" rx="2" fill="#2f3a35"/>
  <g fill="none" stroke="#e5484d" stroke-width="4" stroke-dasharray="10 7">
    <rect x="40" y="96" width="160" height="66" rx="12"/>
    <circle cx="232" cy="134" r="40"/>
    <circle cx="370" cy="96" r="58"/>
  </g>
</svg>
