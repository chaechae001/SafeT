<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>내 평가표 · Safe-T</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../css/common.css?v=20261125">
  <link rel="stylesheet" href="../css/home.css?v=20261125">
  <link rel="stylesheet" href="../css/ux-guide.css?v=20261125">
</head>
<body class="page-home" data-auth-required data-ux-guide>
  <div class="app">
    <header class="topbar">
      <a class="logo" href="home.html">Safe-T</a>
      <details class="menu">
        <summary aria-label="메뉴">≡</summary>
        <nav class="menu__list" aria-label="주 메뉴">
          <a href="home.html" aria-current="page">내 평가표</a>
          <a href="workplace.html">사업장 관리</a>
          <a href="trash.html">휴지통</a>
          <a href="login.html">로그아웃</a>
        </nav>
      </details>
    </header>

    <main class="views">
      <section class="view home is-active" id="v-home" aria-label="H01 내 평가표">
        <div class="page">
          <h1 class="page-title">내 평가표</h1>

          <nav class="tabs" aria-label="평가표 상태">
            <a href="#v-home" data-tab="ALL" aria-current="page">전체</a>
            <a href="#v-home" data-tab="W">작성 중</a>
            <a href="#v-home" data-tab="C">확정</a>
            <a href="#v-home" data-tab="S">서명 완료</a>
          </nav>

          <form class="home__filter" id="home-filter" method="get" action="#v-home">
            <div class="field period">
              <span class="label" id="period-label">기간</span>
              <button class="input period__view" id="period-view" type="button" aria-expanded="false" aria-controls="period-panel" aria-describedby="period-label">
                <span id="period-text"></span><i data-ico="calendar"></i>
              </button>
              <div class="period__panel" id="period-panel" hidden>
              <div class="date-range" role="group" aria-labelledby="period-label">
                <div class="date-input">
                  <label class="sr-only" for="from_dt">시작일</label>
                  <input class="input" id="from_dt" name="from_dt" inputmode="numeric" placeholder="YYYY.MM.DD">
                  <button class="date-input__icon" type="button" aria-label="시작일 달력 열기">📅</button>
                </div>
                <span aria-hidden="true">~</span>
                <div class="date-input">
                  <label class="sr-only" for="to_dt">종료일</label>
                  <input class="input" id="to_dt" name="to_dt" inputmode="numeric" placeholder="YYYY.MM.DD">
                  <button class="date-input__icon" type="button" aria-label="종료일 달력 열기">📅</button>
                </div>
              </div>
              <button class="btn btn--sm period__close" id="period-close" type="button">닫기</button>
              </div>
            </div>

            <div class="field">
              <label class="label" for="work_no">사업장</label>
              <select class="select" id="work_no" name="work_no">
                <option value="">-전체-</option>
              </select>
            </div>
          </form>

          <div class="home__scroll" id="home-scroll" tabindex="-1" aria-label="평가표 목록">
          <p class="notice notice--danger" id="eval-error" hidden>
            <span class="js-msg">평가표 목록을 불러오지 못했어요.</span>
            <button class="btn btn--sm" id="eval-retry" type="button">다시 불러오기</button>
          </p>
          <ul class="card-list" id="eval-list" aria-live="polite"></ul>

          <nav class="pager" id="pager" aria-label="페이지" hidden></nav>
          <div class="empty" id="eval-empty" hidden>
            <p>이 기간에 작성한 평가표가 없어요.</p>
          </div>
          </div>
        </div>
        <div class="bottom-bar">
          <a class="btn btn--primary" href="write.html"><i data-ico="plus"></i>새 평가표</a>
        </div>
      </section>
    </main>

    <p class="disclaimer">화면·입력 예시이며 실제 현장 판정이 아닙니다.</p>
  </div>

  <script src="../js/vendor/jquery-3.7.1.min.js?v=20261117"></script>
  <script src="../js/common.js?v=20261125"></script>
  <script src="../js/ui-icons.js?v=20261125"></script>
  <script src="../js/config.js?v=20261125"></script>
  <script src="../js/api.js?v=20261125"></script>
  <script src="../js/home.js?v=20261125"></script>
  <script src="../js/ux-guide.js?v=20261125"></script>
</body>
</html>
