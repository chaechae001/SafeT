<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>참여자 서명 · Safe-T</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/sign.css">
</head>
<body data-auth-required>
  <!-- sign.html · 화면설계서 v3.19 통합본
       화면(view) 목록 (처음 화면 = .is-active)
       - #v-pick : SIGN ① 참여자 선택
       - #v-draw : SIGN ② 서명
       전환: jQuery로 .view 의 .is-active 를 바꿉니다. JS 없이 확인할 때는 주소 끝에 #view-id 를 붙입니다. -->
  <div class="app">
    <header class="topbar">
      <a class="logo" href="home.html">Safe-T</a>
      <details class="menu">
        <summary aria-label="메뉴">≡</summary>
        <nav class="menu__list" aria-label="주 메뉴">
          <a href="home.html">내 평가표</a>
          <a href="workplace.html">사업장 관리</a>
          <a href="trash.html">휴지통</a>
          <a href="login.html">로그아웃</a>
        </nav>
      </details>
    </header>

    <main class="views">
      <section class="view sign is-active" id="v-pick" aria-label="SIGN ① 참여자 선택">
        <!-- SIGN ① 참여자 선택 · 화면설계서 29쪽
             테이블: eval_member(member_nm) · eval_sign(member_no, signer_type, sign_yn, sign_dt)
             - 확정(eval_status='C')된 평가표에서만 열림
             - 서명 완료한 사람은 흐리게, 선택 불가
             - 전원 서명 완료 시 '모두 서명했습니다' + 하단 '내 평가표로' -->
        <div class="page">
          <div class="stack">
            <h1 class="page-title">참여자 서명</h1>
            <p class="eyebrow">11월 주방 위험성평가 · 확정본 · 서명 <span id="sign-count">1/3</span></p>
          </div>

          <!-- 전원 서명 완료 시 (예시 · 숨김) -->
          <p class="notice notice--done" id="sign-done" hidden>모두 서명했습니다.</p>

          <form id="pick-form" class="stack" action="#v-draw" method="get">
            <fieldset class="check-list" id="signer-list">
              <legend class="page-desc">본인 이름을 선택해 주세요. 기본정보에 등록한 참여 근로자예요.</legend>
              <label class="check signer signer--done">
                <input type="radio" name="member_no" value="1" disabled>
                <span class="check__text"><b>이민호</b> <span class="muted small">· 참여 근로자</span></span>
                <span class="tag">서명 완료</span>
              </label>
              <label class="check signer">
                <input type="radio" name="member_no" value="2" checked>
                <span class="check__text"><b>박지수</b> <span class="muted small">· 참여 근로자</span></span>
                <span class="tag tag--warn">서명 필요</span>
              </label>
              <label class="check signer">
                <input type="radio" name="member_no" value="3">
                <span class="check__text"><b>정유진</b> <span class="muted small">· 참여 근로자</span></span>
                <span class="tag tag--warn">서명 필요</span>
              </label>
            </fieldset>
          </form>
        </div>
        <div class="bottom-bar">
          <button class="btn btn--primary" id="pick-btn" type="submit" form="pick-form">박지수로 서명하기</button>
          <!-- 전원 서명 완료 시: <a class="btn btn--primary" href="home.html">내 평가표로</a> -->
        </div>
      </section>
      <section class="view sign" id="v-draw" aria-label="SIGN ② 서명">
        <!-- SIGN ② 서명 · 화면설계서 29쪽
             테이블: eval_sign(confirm_yn, sign_img, sign_yn, sign_dt)
             - 확인 체크 + 서명 획이 있어야 '서명 저장' 활성
             - 저장한 서명은 정정 불가. 저장은 원형 로딩만
             - 공유본에는 다른 사람의 서명 원본을 넣지 않음 -->
        <div class="page">
          <div class="stack">
            <h1 class="page-title">참여자 서명</h1>
            <p class="eyebrow">11월 주방 위험성평가 · 확정본</p>
          </div>

          <form id="sign-form" class="stack" action="#v-pick" method="get">
            <div class="card">
              <p class="card__title" id="draw-name">박지수 · 참여 근로자</p>
              <p class="card__meta">이 평가에 참여했고, 확정된 결과와 계획을 확인했어요.</p>
            </div>

            <label class="check">
              <input type="checkbox" name="confirm_yn" value="Y" required>
              <span class="check__text">결과와 계획을 확인했어요</span>
            </label>

            <!-- 서명 칸: 실제 그리기는 JS 단계에서 canvas 로 구현 -->
            <div class="sign-pad" id="sign-pad" role="img" aria-label="서명 입력 칸">여기에 직접 서명</div>
            <div class="row sign-pad__tools">
              <button class="btn btn--sm" id="sign-clear" type="button">지우기</button>
            </div>
            <p class="hint">저장한 서명은 정정할 수 없어요.</p>
          </form>
        </div>
        <div class="bottom-bar">
          <a class="btn" href="#v-pick">이전</a>
          <button class="btn btn--primary" id="sign-save" type="submit" form="sign-form">서명 저장</button>
        </div>
      </section>
    </main>

    <p class="disclaimer">화면·입력 예시이며 실제 현장 판정이 아닙니다.</p>
  </div>

  <script src="../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/sign.js"></script>
</body>
</html>
