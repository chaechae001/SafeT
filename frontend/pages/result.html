<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>확정된 평가표 · Safe-T</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/assessment.css">
  <link rel="stylesheet" href="../css/result.css">
  <link rel="stylesheet" href="../css/risk.css">
</head>
<body data-auth-required data-assessment>
  <!-- result.html · 화면설계서 v3.19 통합본 SH v3
       화면(view) 목록 (처음 화면 = .is-active)
       - #v-list : S08 확정된 평가표
       - #v-detail : S08-D 위험 상세(읽기 전용)
       전환: jQuery로 .view 의 .is-active 를 바꿉니다. JS 없이 확인할 때는 주소 끝에 #view-id 를 붙입니다. -->
  <div class="app">
    <header class="topbar">
      <a class="logo" href="home.html">Safe-T</a>
      <details class="menu">
        <summary aria-label="메뉴">≡</summary>
        <nav class="menu__list" aria-label="주 메뉴">
          <a href="home.html">내 평가표</a>
          <a href="workplace.html">사업장 관리</a>
          <a href="trash.html">휴지통</a>
          <a href="login.html">로그아웃</a>
        </nav>
      </details>
    </header>

    <main class="views">
      <section class="view result is-active" id="v-list" aria-label="S08 확정된 평가표">
        <!-- S08 확정된 평가표 보기 · 읽기 전용 · 화면설계서 27쪽
             테이블: eval_mst(eval_status='C', confirm_dt) · eval_dtl · eval_action(check_yn='Y'만)
             - 체크박스·입력칸·편집 버튼 없음. 수정 불가·버전 없음·삭제 불가
             - 서명·공유는 내 평가표 카드 버튼에서 (여기에는 두지 않음)
             - 하단: 내 평가표로 / 엑셀 다운로드(지점장 수정용) -->
        <div class="page" aria-live="polite"><p>평가표를 불러오고 있어요.</p></div>
        <div class="bottom-bar">
          <a class="btn" href="home.html">내 평가표로</a>
          <button class="btn btn--primary" type="button" data-todo="엑셀 다운로드는 API 연결 후 동작해요.">엑셀 다운로드</button>
        </div>
      </section>
      <section class="view risk" id="v-detail" aria-label="S08-D 위험 상세(읽기 전용)">
        <!-- S08-D 확정된 평가표 · 위험 상세 (읽기 전용) · 화면설계서 28쪽
             테이블: eval_dtl(reason, risk_reason, law, law_summary, law_dtl, after_risk_grade) · eval_action(check_yn='Y')
             - 판단 이유·법령을 펼친 상태로 표시. 법령 원문은 새 창, 검증되지 않은 조항은 표시하지 않음
             - 체크해서 확정한 조치·대책만 나열 (고르지 않은 후보는 숨김)
             - 이전·다음·목록 버튼만 (체크박스·입력칸·저장 없음) -->
        <div class="page" aria-live="polite"></div>
        <div class="bottom-bar">
          <a class="btn" href="#v-detail" aria-disabled="true">이전 항목</a>
          <a class="btn" href="#v-list">목록</a>
          <button class="btn" type="button" data-todo="다른 항목 이동은 API 연결 후 동작해요.">다음 항목</button>
        </div>
      </section>
    </main>

    <p class="disclaimer">화면·입력 예시이며 실제 현장 판정이 아닙니다.</p>
  </div>

  <script src="../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/risk-assessment.js"></script>
  <script src="../js/assessment-result.js"></script>
</body>
</html>
