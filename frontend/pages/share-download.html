<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>위험성평가표 내려받기 · Safe-T</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/share.css">
</head>
<body>
  <!-- share-download.html · 화면설계서 v3.19 통합본
       화면(view) 목록 (처음 화면 = .is-active)
       - #v-download : SHARE 받는 사람 화면
       전환: jQuery로 .view 의 .is-active 를 바꿉니다. JS 없이 확인할 때는 주소 끝에 #view-id 를 붙입니다. -->
  <div class="app">
    <header class="topbar">
      <span class="logo">Safe-T</span>
    </header>

    <main class="views">
      <section class="view share is-active" id="v-download" aria-label="SHARE 받는 사람 화면">
        <!-- SHARE 받는 사람 화면 (링크로 열림 · 로그인 없음) · 화면설계서 30쪽
             - 평가표 이름·사업장·평가일·확정일과 PDF 파일 정보, PDF 다운로드 버튼 하나
             - 항목 수정·서명 없음. 열람·다운로드는 결과 확인·서명으로 기록하지 않음(다운로드 횟수만)
             - 만료·중지된 링크는 만료 안내 -->
        <div class="page">
          <div class="stack">
            <h1 class="page-title">11월 주방 위험성평가</h1>
            <dl class="kv">
              <dt>사업장</dt><dd>온기치킨 성수점</dd>
              <dt>평가일</dt><dd>2026.11.14</dd>
              <dt>확정일</dt><dd>2026.11.14</dd>
              <dt>위험 항목</dt><dd>7건</dd>
              <dt>작성자</dt><dd>김하늘</dd>
            </dl>
          </div>

          <div class="card share__file">
            <span class="share__file-icon" aria-hidden="true">PDF</span>
            <div>
              <p class="strong">11월주방위험성평가_20261114_확정.pdf</p>
              <p class="card__meta">위험성평가표 전체 · 약 1.2MB</p>
            </div>
          </div>

          <p class="hint center">이 링크는 2026.11.21까지 열 수 있어요.</p>

          <!-- 만료·중지된 링크일 때 (예시 · 숨김) -->
          <p class="notice notice--danger" hidden>링크가 만료되었어요. 보낸 분께 다시 요청해 주세요.</p>
        </div>
        <div class="bottom-bar">
          <button class="btn btn--primary" id="pdf-download" type="button">PDF 다운로드</button>
        </div>
      </section>
    </main>

    <p class="disclaimer">화면·입력 예시이며 실제 현장 판정이 아닙니다.</p>
  </div>

  <script src="../js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/share.js"></script>
</body>
</html>
