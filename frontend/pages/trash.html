<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>휴지통 · Safe-T</title>
  <!-- UX-019: Pretendard 실제 로드(가변·필요 글자만). 실패하면 시스템 한글 글꼴로 대체 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../css/common.css?v=20261124">
</head>
<body data-auth-required>
  <!-- trash.html · 화면설계서 v3.19 통합본
       화면(view) 목록 (처음 화면 = .is-active)
       - #v-trash : H02 휴지통
       전환: jQuery로 .view 의 .is-active 를 바꿉니다. JS 없이 확인할 때는 주소 끝에 #view-id 를 붙입니다. -->
  <div class="app">
    <header class="topbar">
      <a class="logo" href="home.html">Safe-T</a>
      <details class="menu">
        <summary aria-label="메뉴">≡</summary>
        <nav class="menu__list" aria-label="주 메뉴">
          <a href="home.html">내 평가표</a>
          <a href="workplace.html">사업장 관리</a>
          <a href="trash.html" aria-current="page">휴지통</a>
          <a href="login.html">로그아웃</a>
        </nav>
      </details>
    </header>

    <main class="views">
      <section class="view is-active" id="v-trash" aria-label="H02 휴지통">
        <!-- H02 휴지통 · 화면설계서 31쪽
             테이블: eval_mst(del_yn='Y', del_dt) · 작성 중 평가표만 대상, 30일 뒤 자동 영구 삭제
             - 확정·서명된 평가표는 삭제 불가(법정 기록 보존 3년)
             - 복원하면 작성 중 탭으로 돌아감
             - API: GET /trash · POST /trash/{번호}/restore · DELETE /trash/{번호} (trash.js) -->
        <div class="page">
          <div class="stack">
            <h1 class="page-title">휴지통</h1>
            <p class="page-desc">삭제한 작성 중 평가표는 30일 동안 여기에 남아요.</p>
          </div>

          <!-- 휴지통 목록은 trash.js 가 서버 값으로 채움 -->
          <ul class="card-list" id="trash-list" aria-busy="true" aria-live="polite"></ul>
          <p class="empty" id="trash-empty" hidden>휴지통이 비어 있어요.</p>

          <p class="notice notice--muted small">영구 삭제하면 복원할 수 없어요. 확정·서명된 평가표는 삭제할 수 없어요.</p>
        </div>
        <div class="modal" id="purge-1" role="alertdialog" aria-modal="true" aria-labelledby="purge-1-title">
          <div class="modal__box">
            <div class="modal__head">
              <h2 class="modal__title" id="purge-1-title">영구 삭제할까요?</h2>
              <a class="modal__close" href="#v-trash" data-close aria-label="닫기">X</a>
            </div>
            <div class="modal__body">
              <p>영구 삭제하면 복원할 수 없어요.</p>
            </div>
            <div class="modal__foot">
              <a class="btn" href="#v-trash" data-close>취소</a>
              <button class="btn btn--danger" id="purge-ok" type="button">영구 삭제</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <p class="disclaimer">보관 기간 30일이 지난 평가표는 자동으로 영구 삭제돼요.</p>
  </div>

  <script src="../js/vendor/jquery-3.7.1.min.js?v=20261117"></script>
  <script src="../js/common.js?v=20261124"></script>
  <script src="../js/config.js?v=20261124"></script>
  <script src="../js/api.js?v=20261124"></script>
  <script src="../js/trash.js?v=20261124"></script>
</body>
</html>
